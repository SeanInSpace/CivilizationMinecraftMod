// The NeoForge platform layer.
//
// This module owns everything that touches Minecraft: registration, events,
// persistence, networking, rendering, and the entity "view" layer that
// materializes simulated people as real mobs near players.
//
// It depends on :common. :common never depends on it.

plugins {
    id 'net.neoforged.moddev' version '2.0.144'
}

// Keystone is a separate mod living in the same build. Force its evaluation
// first so its source set can be registered as a second mod in the runs below.
evaluationDependsOn(':keystone')

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            // Opt-in quickplay: ./gradlew :neoforge:runClient -Pquickplay=<world>
            //
            // Deliberately not on by default. A hardcoded world name breaks every
            // launch the moment that world is deleted, which is exactly what it
            // did the last time it was wired in unconditionally.
            if (project.hasProperty('quickplay')) {
                programArguments.addAll('--quickPlaySingleplayer',
                        project.property('quickplay').toString())
            }
            // Join a running dedicated server instead:
            //   ./gradlew :neoforge:runClient -PjoinServer=localhost
            //
            // Some faults only exist where a player is standing. Settlers are
            // only embodied within the observed radius, so anything about real
            // bodies -- pathing, a wall somebody is shut outside of -- is
            // invisible to a headless run, and a headless run reports zero for
            // it either way. This puts a player in the world while the server
            // console does the asking.
            if (project.hasProperty('joinServer')) {
                programArguments.addAll('--quickPlayMultiplayer',
                        project.property('joinServer').toString())
            }
        }
        server {
            server()
        }
    }

    mods {
        register(project.mod_id) {
            sourceSet sourceSets.main
        }
        // Registered here rather than in :keystone so that one runClient boots
        // both mods, exactly as a player installing two jars would see them.
        register(project.keystone_id) {
            sourceSet project(':keystone').sourceSets.main
        }
    }

    // Unit tests for the platform half.
    //
    // Half this module's line count had no tests at all, because everything in
    // it can reach Minecraft and Minecraft cannot simply be new-ed up in a JUnit
    // run. ModDevGradle's unitTest puts a real, bootstrapped game on the test
    // classpath, which is what makes the geometry and the ledger mirror -- the
    // two places bugs kept surviving green builds -- reachable by a test at all.
    unitTest {
        enable()
        testedMod = mods.named(project.mod_id)
    }
}

// Wire the console through to the dev runs. Without this, typing "stop" into a
// running server does nothing — which server.bat has been telling people to do —
// and a scripted playtest has no way to issue commands at all.
tasks.matching { it.name in ['runServer', 'runClient'] }.configureEach {
    standardInput = System.in
}

// Otherwise the jar is named after the subproject ("neoforge-0.1.0.jar").
base {
    archivesName = project.mod_id
}

dependencies {
    implementation project(':common')
    // Kingdoms consumes blueprints through Keystone's BlueprintSource seam.
    // Keystone never depends on Kingdoms.
    implementation project(':keystone')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Bundle the loader-free simulation core into the mod jar.
tasks.named('jar', Jar) {
    dependsOn ':common:classes'
    from project(':common').sourceSets.main.output
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
tasks.named('processResources', ProcessResources) {
    def props = [
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            mod_version      : project.mod_version,
            mod_license      : project.mod_license,
            mod_authors      : project.mod_authors,
            mod_description  : project.mod_description,
            minecraft_version: project.minecraft_version,
            neoforge_version : project.neoforge_version,
            keystone_version : project.keystone_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
