<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town View</title>
<!--
  A local viewer for /civ plan surveys.

  Open this file directly. Drop one or more survey JSONs on it (or use the
  button); pick one for the left panel and one for the right, and the two
  views stay locked together so the same ground is under both. That is the
  whole point: a layout argument is only worth anything when the seed, the
  ground and the population are held still and one thing changes.

  No build step, no server, no network. file:// blocks fetch, so the surveys
  arrive through a file picker instead -- which also means you can compare two
  runs from different days without moving anything into place first.
-->
<style>
  :root {
    --paper:#EDEFE9; --sunk:#E3E7DE; --card:#F5F7F2;
    --ink:#1B2A24; --soft:#4C5C54; --faint:#7A887F;
    --rule:#C3C9BE; --ruleF:#D9DED3; --brass:#B07E18;
    --landLo:#DDE2D2; --landHi:#8F9C82; --water:#7C99A8; --road:#B8A882;
    --dwelling:#3F7D5A; --food:#8C9B3A; --industry:#B4472F;
    --trade:#B07E18; --civic:#5A4E8C; --defence:#2E5F73;
    --sans:"IBM Plex Sans Condensed","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#141D19; --sunk:#101815; --card:#1B2622;
      --ink:#E2E8DD; --soft:#A9B6AC; --faint:#77857B;
      --rule:#2F3E37; --ruleF:#243029; --brass:#D7A63F;
      --landLo:#232E27; --landHi:#6E7C64; --water:#33505F; --road:#5A5138;
      --dwelling:#6FBE8E; --food:#B9CB55; --industry:#E28368;
      --trade:#D7A63F; --civic:#9C90D8; --defence:#5E9CB8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 14px;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    border-bottom: 1px solid var(--rule); padding: .5rem .8rem;
    display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center;
    background: var(--card); flex: none;
  }
  h1 {
    font-size: 1rem; font-weight: 700; margin: 0 .6rem 0 0;
    letter-spacing: .01em; white-space: nowrap;
  }
  .hint { font-family: var(--mono); font-size: .7rem; color: var(--faint); }

  button, select, label.file {
    font-family: var(--sans); font-size: .8rem; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 2px; padding: .28rem .6rem; cursor: pointer;
  }
  button:hover, label.file:hover { border-color: var(--brass); }
  button[aria-pressed="true"] { background: var(--sunk); border-color: var(--brass); }
  button:focus-visible, select:focus-visible, label.file:focus-within {
    outline: 2px solid var(--brass); outline-offset: 1px;
  }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .layers { display: flex; gap: .3rem; flex-wrap: wrap; }
  .layers button { font-family: var(--mono); font-size: .7rem; letter-spacing: .04em; }
  .swatch {
    display: inline-block; width: 9px; height: 9px; margin-right: .3rem;
    vertical-align: -1px;
  }

  main { flex: 1; display: flex; min-height: 0; }
  .panel {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--rule);
  }
  .panel:last-child { border-right: none; }
  .panel.hidden { display: none; }

  .panel-bar {
    display: flex; gap: .5rem; align-items: center; padding: .35rem .6rem;
    border-bottom: 1px solid var(--ruleF); background: var(--card); flex: none;
  }
  .panel-bar select { flex: 1; min-width: 0; }
  .stats {
    font-family: var(--mono); font-size: .68rem; color: var(--soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .stage { position: relative; flex: 1; min-height: 0; background: var(--sunk); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tip {
    position: absolute; pointer-events: none; z-index: 3;
    background: var(--card); border: 1px solid var(--brass);
    font-family: var(--mono); font-size: .68rem; line-height: 1.5;
    padding: .3rem .45rem; max-width: 220px; display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .empty {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 2rem;
    color: var(--faint); font-family: var(--mono); font-size: .78rem;
    line-height: 1.8; z-index: 2;
  }
  .diffbar {
    flex: none; border-top: 1px solid var(--rule); background: var(--card);
    padding: .4rem .8rem; font-family: var(--mono); font-size: .72rem;
    color: var(--soft); display: flex; flex-wrap: wrap; gap: .3rem 1.4rem;
  }
  .diffbar b { color: var(--ink); font-weight: 600; }
  .up { color: var(--industry); }
  .down { color: var(--dwelling); }
</style>
</head>
<body>

<header>
  <h1>Town View</h1>
  <label class="file" tabindex="0">
    Load surveys<input id="files" type="file" accept=".json" multiple>
  </label>
  <button id="split" aria-pressed="true">Compare</button>
  <button id="lock" aria-pressed="true">Lock views</button>
  <button id="fit">Fit</button>
  <div class="layers" id="layers"></div>
  <span class="hint">drag to pan &middot; wheel to zoom &middot; hover a building</span>
</header>

<main>
  <div class="panel" data-side="a">
    <div class="panel-bar">
      <select data-role="pick"></select>
      <span class="stats" data-role="stats"></span>
    </div>
    <div class="stage">
      <canvas></canvas>
      <div class="tip"></div>
      <div class="empty">Drop <code>/civ plan</code> survey files here<br>
        or use <b>Load surveys</b><br><br>
        <code>python tools/survey.py neoforge/run/logs/latest.log surveys/</code>
      </div>
    </div>
  </div>
  <div class="panel" data-side="b">
    <div class="panel-bar">
      <select data-role="pick"></select>
      <span class="stats" data-role="stats"></span>
    </div>
    <div class="stage">
      <canvas></canvas>
      <div class="tip"></div>
      <div class="empty">Second survey goes here</div>
    </div>
  </div>
</main>

<div class="diffbar" id="diff">Load two surveys of the same seed to compare them.</div>

<script>
"use strict";

var GROUPS = ["dwelling", "food", "industry", "trade", "civic", "defence"];
var LAYERS = [
  { id: "ground", label: "ground" },
  { id: "water",  label: "water" },
  { id: "unread", label: "unread" },
  { id: "roads",  label: "roads" },
  { id: "wall",   label: "wall" },
  { id: "plots",  label: "plots" }
].concat(GROUPS.map(function (g) { return { id: g, label: g, colour: g }; }));

var surveys = [];                 // every loaded survey
var on = {};                      // which layers are drawn
LAYERS.forEach(function (l) { on[l.id] = true; });

// One shared camera, so the two panels look at the same ground. That is the
// entire reason this tool exists rather than two screenshots side by side.
var cam = { x: 0, z: 0, scale: 1 };
var locked = true, split = true;

// Four states, not two. A survey says whether a column came from a real chunk
// ('.'), from the generator's noise (':'), or was never read at all ('?', or a
// null height). Older surveys have neither marker; those read as certain,
// which is what they were.
function groundState(t, r, c) {
  if (r < 0 || c < 0 || r >= t.grid.length || c >= t.grid[r].length) return "?";
  if (t.grid[r][c] === null) return "?";
  var ch = t.wet[r] ? t.wet[r].charAt(c) : "";
  if (ch === "~" || ch === ":" ) return ch;
  if (ch === "?" || ch === "") return "?";
  return ".";
}

function css(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function mix(a, b, t) {
  function part(c) {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16),
            parseInt(c.slice(5, 7), 16)];
  }
  var p = part(a), q = part(b);
  return "rgb(" + Math.round(p[0] + (q[0] - p[0]) * t) + ","
                + Math.round(p[1] + (q[1] - p[1]) * t) + ","
                + Math.round(p[2] + (q[2] - p[2]) * t) + ")";
}

function Panel(root) {
  this.root = root;
  this.canvas = root.querySelector("canvas");
  this.tip = root.querySelector(".tip");
  this.empty = root.querySelector(".empty");
  this.pick = root.querySelector("[data-role=pick]");
  this.stats = root.querySelector("[data-role=stats]");
  this.town = null;
  var self = this;

  this.pick.addEventListener("change", function () {
    self.town = surveys[self.pick.value] || null;
    self.describe();
    if (!locked) fit(self);
    redraw();
    describeDiff();
  });

  var dragging = false, lastX = 0, lastY = 0;
  this.canvas.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    self.canvas.setPointerCapture(e.pointerId);
  });
  this.canvas.addEventListener("pointerup", function (e) {
    dragging = false;
    self.canvas.releasePointerCapture(e.pointerId);
  });
  this.canvas.addEventListener("pointerleave", function () {
    dragging = false; self.tip.style.display = "none";
  });
  this.canvas.addEventListener("pointermove", function (e) {
    if (dragging) {
      var k = self.pixelsPerBlock();
      cam.x -= (e.clientX - lastX) / k;
      cam.z -= (e.clientY - lastY) / k;
      lastX = e.clientX; lastY = e.clientY;
      redraw();
      return;
    }
    self.hover(e);
  });
  this.canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var before = self.toWorld(e);
    cam.scale *= Math.exp(-e.deltaY * 0.0016);
    cam.scale = Math.min(8, Math.max(0.15, cam.scale));
    var after = self.toWorld(e);
    cam.x += before.x - after.x;
    cam.z += before.z - after.z;
    redraw();
  }, { passive: false });
}

Panel.prototype.size = function () {
  var r = this.canvas.getBoundingClientRect();
  return { w: Math.max(1, r.width), h: Math.max(1, r.height), r: r };
};

// One scale for both panels: derived from the SHORTER side of whichever panel,
// so a wide window and a narrow one still show the same blocks per pixel.
Panel.prototype.pixelsPerBlock = function () {
  var s = this.size();
  return (Math.min(s.w, s.h) / 420) * cam.scale;
};

Panel.prototype.toWorld = function (e) {
  var s = this.size(), k = this.pixelsPerBlock();
  return {
    x: cam.x + (e.clientX - s.r.left - s.w / 2) / k,
    z: cam.z + (e.clientY - s.r.top - s.h / 2) / k
  };
};

Panel.prototype.project = function (wx, wz) {
  var s = this.size(), k = this.pixelsPerBlock();
  return { x: s.w / 2 + (wx - cam.x) * k, y: s.h / 2 + (wz - cam.z) * k };
};

// Where a town's buildings actually stand. This is the measure that settled
// every siting argument today, and it has to exclude ground the survey never
// read -- counting unread as dry is how a rule that put nothing in water and a
// rule that put eight looked the same.
function standing(t) {
  var reach = ((t.grid[0] ? t.grid[0].length : 1) - 1) * t.step / 2;
  var cx = t.centre[0], cz = t.centre[2];
  var wet = 0, dry = 0, unjudged = 0;
  for (var i = 0; i < t.builds.length; i++) {
    var b = t.builds[i];
    var c = Math.round((b[1] - cx + reach) / t.step);
    var r = Math.round((b[3] - cz + reach) / t.step);
    var state = groundState(t, r, c);
    if (state === "~") wet++;
    else if (state === "?") unjudged++;
    else dry++;
  }
  return { wet: wet, dry: dry, unjudged: unjudged, judged: wet + dry };
}

Panel.prototype.describe = function () {
  var t = this.town;
  this.empty.style.display = t ? "none" : "flex";
  if (!t) { this.stats.textContent = ""; return; }
  var s = standing(t);
  this.stats.textContent = t.layout + " · " + t.pop + "p · "
    + t.builds.length + "b · " + t.roads.length + "r · "
    + t.laid + "/" + t.ringlen
    + " · " + s.wet + " in water"
    + (s.unjudged ? " (" + s.unjudged + " unjudged)" : "");
};

Panel.prototype.buildingAt = function (wx, wz) {
  var t = this.town;
  if (!t) return null;
  for (var i = t.builds.length - 1; i >= 0; i--) {
    var b = t.builds[i], half = b[4] / 2;
    if (Math.abs(wx - b[1]) <= half && Math.abs(wz - b[3]) <= half) return b;
  }
  return null;
};

Panel.prototype.hover = function (e) {
  var w = this.toWorld(e), b = this.buildingAt(w.x, w.z);
  if (!b) { this.tip.style.display = "none"; return; }
  var s = this.size();
  this.tip.innerHTML = "<b>" + b[0].replace(/_/g, " ") + "</b><br>"
    + b[1] + " " + b[2] + " " + b[3] + "<br>"
    + "plot " + b[4] + " · facing " + b[5] + "<br>" + b[6].toLowerCase();
  this.tip.style.display = "block";
  this.tip.style.left = Math.min(s.w - 232, e.clientX - s.r.left + 12) + "px";
  this.tip.style.top = Math.min(s.h - 90, e.clientY - s.r.top + 12) + "px";
};

Panel.prototype.draw = function () {
  var cv = this.canvas, s = this.size();
  var dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(s.w * dpr);
  cv.height = Math.round(s.h * dpr);
  var g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, s.w, s.h);
  var t = this.town;
  if (!t) return;

  var k = this.pixelsPerBlock();
  var self = this;
  function P(wx, wz) { return self.project(wx, wz); }
  var cx = t.centre[0], cz = t.centre[2];

  if (on.ground || on.water || on.unread) {
    var lo = css("--landLo"), hi = css("--landHi"), water = css("--water");
    var faint = css("--faint"), sunk = css("--sunk");
    var min = 999, max = -999, r, c, hh;
    for (r = 0; r < t.grid.length; r++)
      for (c = 0; c < t.grid[r].length; c++) {
        hh = t.grid[r][c];
        if (hh === null) continue;
        if (hh < min) min = hh;
        if (hh > max) max = hh;
      }
    var cell = t.step * k + 0.8;
    var reach = ((t.grid[0] ? t.grid[0].length : 1) - 1) * t.step / 2;
    for (r = 0; r < t.grid.length; r++) {
      var wz = cz + t.zs[r];
      for (c = 0; c < t.grid[r].length; c++) {
        var state = groundState(t, r, c);
        hh = t.grid[r][c];
        if (state === "~" && !on.water) continue;
        if ((state === "." || state === ":") && !on.ground) continue;
        if (state === "?" && !on.unread) continue;
        var wx = cx - reach + c * t.step;
        var p = P(wx, wz);
        if (p.x < -cell || p.y < -cell || p.x > s.w + cell || p.y > s.h + cell) continue;
        if (state === "?") {
          // Never read. Hatched, never colored. An unread square is not a steep
          // one and must not be able to look like one -- a survey whose southern
          // tenth had simply not loaded once came out solid red and read as a
          // cliff face.
          g.fillStyle = sunk;
          g.fillRect(p.x - cell / 2, p.y - cell / 2, cell, cell);
          if (((r + c) % 5) === 0) {
            g.fillStyle = faint;
            g.fillRect(p.x - cell / 2, p.y - cell / 2,
                       Math.max(1, cell * 0.35), Math.max(1, cell * 0.35));
          }
          continue;
        }
        g.fillStyle = state === "~" ? water
                    : mix(lo, hi, (hh - min) / Math.max(1, max - min));
        // An estimate is drawn as an estimate. ':' means the generator's noise
        // answered, not a loaded chunk, and those differ by about eight courses.
        g.globalAlpha = state === ":" ? 0.5 : 1;
        g.fillRect(p.x - cell / 2, p.y - cell / 2, cell, cell);
        g.globalAlpha = 1;
      }
    }
  }

  if (on.roads) {
    g.strokeStyle = css("--road");
    g.lineWidth = Math.max(1, 3 * k);
    g.lineCap = "round";
    for (var i = 0; i < t.roads.length; i++) {
      var seg = t.roads[i];
      var a = P(seg[0], seg[1]), b = P(seg[2], seg[3]);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
  }

  if (on.wall && t.verts.length) {
    g.strokeStyle = css("--ink");
    g.lineWidth = 1.6;
    g.beginPath();
    for (var v = 0; v < t.verts.length; v++) {
      var q = P(t.verts[v][0], t.verts[v][1]);
      if (v) g.lineTo(q.x, q.y); else g.moveTo(q.x, q.y);
    }
    g.closePath(); g.stroke();
    g.fillStyle = css("--brass");
    for (var gi = 0; gi < t.gates.length; gi++) {
      var gp = P(t.gates[gi][0], t.gates[gi][1]);
      g.beginPath(); g.arc(gp.x, gp.y, Math.max(2.5, 4 * k), 0, 7); g.fill();
    }
  }

  if (on.plots) {
    for (var n = 0; n < t.builds.length; n++) {
      var bl = t.builds[n];
      var grp = t.groups[bl[0]] || "civic";
      if (!on[grp]) continue;
      var pp = P(bl[1], bl[3]);
      var side = Math.max(2.5, bl[4] * k);
      g.fillStyle = css("--" + grp);
      g.globalAlpha = 0.88;
      g.fillRect(pp.x - side / 2, pp.y - side / 2, side, side);
      g.globalAlpha = 1;
    }
  }

  var mid = P(cx, cz);
  g.strokeStyle = css("--brass");
  g.lineWidth = 2;
  g.beginPath(); g.arc(mid.x, mid.y, 6, 0, 7); g.stroke();
};

// Frame what the town actually occupies -- wall and buildings both. A fixed
// scale showed a hundred-block village as a postage stamp in the middle of an
// empty sheet, which is a viewer that makes you do the work it exists to do.
function fit(panel) {
  var t = panel.town;
  if (!t) return;
  var cx = t.centre[0], cz = t.centre[2], reach = 40, i;
  for (i = 0; i < t.builds.length; i++) {
    reach = Math.max(reach,
      Math.abs(t.builds[i][1] - cx) + t.builds[i][4] / 2,
      Math.abs(t.builds[i][3] - cz) + t.builds[i][4] / 2);
  }
  for (i = 0; i < t.verts.length; i++) {
    reach = Math.max(reach, Math.abs(t.verts[i][0] - cx),
                            Math.abs(t.verts[i][1] - cz));
  }
  cam.x = cx;
  cam.z = cz;
  cam.scale = 420 * 0.92 / (2 * reach);
  redraw();
}

var panels = [];
document.querySelectorAll(".panel").forEach(function (root) {
  panels.push(new Panel(root));
});

function redraw() { panels.forEach(function (p) { p.draw(); }); }

function refreshPickers() {
  panels.forEach(function (p, idx) {
    var keep = p.pick.value;
    p.pick.innerHTML = "";
    surveys.forEach(function (s, i) {
      var o = document.createElement("option");
      o.value = i;
      o.textContent = s.label + " — " + s.name + " (" + s.pop + "p)";
      p.pick.appendChild(o);
    });
    var want = keep !== "" && surveys[keep] ? keep
             : Math.min(idx, surveys.length - 1);
    if (surveys.length) {
      p.pick.value = String(want);
      p.town = surveys[want];
    }
    p.describe();
  });
}

function describeDiff() {
  var bar = document.getElementById("diff");
  var a = panels[0].town, b = panels[1].town;
  if (!a || !b || a === b) {
    bar.textContent = surveys.length < 2
      ? "Load two surveys of the same seed to compare them."
      : "Pick a different survey on each side.";
    return;
  }
  function spread(t) {
    var far = 0;
    for (var i = 0; i < t.builds.length; i++) {
      var dx = t.builds[i][1] - t.centre[0], dz = t.builds[i][3] - t.centre[2];
      far = Math.max(far, Math.sqrt(dx * dx + dz * dz));
    }
    return far;
  }
  function roadLength(t) {
    var total = 0;
    for (var i = 0; i < t.roads.length; i++) {
      var r = t.roads[i];
      total += Math.abs(r[2] - r[0]) + Math.abs(r[3] - r[1]);
    }
    return total;
  }
  function row(label, x, y, unit) {
    var d = y - x;
    // Up is not good and down is not bad; they are simply directions. The one
    // place that matters is water, where more is plainly worse.
    var cls = d === 0 ? "" : (d > 0 ? "up" : "down");
    var sign = d > 0 ? "+" : "";
    return "<span>" + label + " <b>" + x + "</b> → <b>" + y + "</b> "
      + "<span class='" + cls + "'>" + sign + d + (unit || "") + "</span></span>";
  }
  var sameGround = a.centre[0] === b.centre[0] && a.centre[2] === b.centre[2];
  var sa = standing(a), sb = standing(b);
  bar.innerHTML =
    "<span>" + a.label + " vs " + b.label + "</span>"
    + row("in water", sa.wet, sb.wet)
    + "<span>judged <b>" + sa.judged + "</b> vs <b>" + sb.judged + "</b>"
    + (sa.unjudged || sb.unjudged
        ? " · unjudged " + sa.unjudged + " vs " + sb.unjudged : "") + "</span>"
    + row("people", a.pop, b.pop)
    + row("buildings", a.builds.length, b.builds.length)
    + row("road", roadLength(a), roadLength(b), " blk")
    + row("ring", a.ringlen, b.ringlen, " posts")
    + row("spread", Math.round(spread(a)), Math.round(spread(b)), " blk")
    + "<span>" + (sameGround
        ? "same center — comparable"
        : "<span class='up'>different centers — NOT the same ground</span>") + "</span>";
}

function addSurveys(list) {
  list.forEach(function (s) {
    if (!s.label) s.label = s.layout || "survey";
    surveys.push(s);
  });
  refreshPickers();
  if (panels[0].town) fit(panels[0]);
  redraw();
  describeDiff();
}

function readFiles(fileList) {
  var pending = [], n = fileList.length;
  if (!n) return;
  Array.prototype.forEach.call(fileList, function (f) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var parsed = JSON.parse(fr.result);
        (Array.isArray(parsed) ? parsed : [parsed]).forEach(function (s) {
          pending.push(s);
        });
      } catch (err) {
        console.error(f.name, err);
      }
      if (--n === 0) addSurveys(pending);
    };
    fr.onerror = function () { if (--n === 0) addSurveys(pending); };
    fr.readAsText(f);
  });
}

document.getElementById("files").addEventListener("change", function (e) {
  readFiles(e.target.files);
  e.target.value = "";
});

["dragenter", "dragover"].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); });
});
document.addEventListener("drop", function (e) {
  e.preventDefault();
  readFiles(e.dataTransfer.files);
});

var layerBar = document.getElementById("layers");
LAYERS.forEach(function (l) {
  var b = document.createElement("button");
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = (l.colour
    ? '<span class="swatch" style="background:var(--' + l.colour + ')"></span>' : "")
    + l.label;
  b.addEventListener("click", function () {
    on[l.id] = !on[l.id];
    b.setAttribute("aria-pressed", String(on[l.id]));
    redraw();
  });
  layerBar.appendChild(b);
});

document.getElementById("split").addEventListener("click", function () {
  split = !split;
  this.setAttribute("aria-pressed", String(split));
  panels[1].root.classList.toggle("hidden", !split);
  redraw();
});
document.getElementById("lock").addEventListener("click", function () {
  locked = !locked;
  this.setAttribute("aria-pressed", String(locked));
});
document.getElementById("fit").addEventListener("click", function () {
  fit(panels[0].town ? panels[0] : panels[1]);
});

window.addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
redraw();
</script>
</body>
</html>
